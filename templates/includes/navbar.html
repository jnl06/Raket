{% load static %}
{# Site navbar (Figma: "Navbar" component). Included by base.html. #}
<header class="navbar">
  <a href="{% url 'jobs:home' %}" class="navbar__logo" aria-label="Raket home">
    <img src="{% static 'image/raket_logo.png' %}" alt="Raket">
  </a>

  <nav class="navbar__links" aria-label="Main">
    <a href="{% url 'jobs:home' %}"
       class="navbar__link{% if request.resolver_match.view_name == 'jobs:home' %} is-active{% endif %}"
       {% if request.resolver_match.view_name == 'jobs:home' %}aria-current="page"{% endif %}>Home</a>

    <a href="#" class="navbar__link navbar__link--menu">
      For workers
      <svg class="navbar__caret" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7l5 5 5-5z" fill="currentColor"/></svg>
    </a>

    <a href="{% url 'jobs:post_job' %}"
       class="navbar__link navbar__link--menu{% if request.resolver_match.view_name == 'jobs:post_job' %} is-active{% endif %}">
      For households
      <svg class="navbar__caret" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7l5 5 5-5z" fill="currentColor"/></svg>
    </a>
  </nav>

  <div class="navbar__account">
    <button type="button" class="navbar__search" aria-label="Search">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M16.5 16.5L21 21"/>
      </svg>
    </button>
    <span class="navbar__separator" aria-hidden="true"></span>
    <a href="#" class="navbar__signup">Sign Up</a>
    <a href="#" class="navbar__signin">Sign In</a>
  </div>
</header>
