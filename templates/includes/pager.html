{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn--ghost btn--sm" href="?{% if page_query %}{{ page_query }}&amp;{% elif status %}status={{ status }}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">&larr; Previous</a>{% else %}<span class="btn btn--ghost btn--sm" aria-disabled="true">&larr; Previous</span>{% endif %}
  <span class="page-status">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--ghost btn--sm" href="?{% if page_query %}{{ page_query }}&amp;{% elif status %}status={{ status }}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next &rarr;</a>{% else %}<span class="btn btn--ghost btn--sm" aria-disabled="true">Next &rarr;</span>{% endif %}
</nav>
{% endif %}
