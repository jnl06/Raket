{% extends "base.html" %}
{% load static %}

{% block title %}Choose a new password - Raket{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=2">
{% endblock %}

{% block content %}
<section class="auth">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="auth-sub">Pick something you haven't used before.</p>

    <form data-auth="reset" data-uid="{{ uid }}" data-token="{{ token }}" novalidate>
      <div class="auth-alert" role="alert" hidden data-alert></div>

      <div class="auth-field">
        <label for="new_password">New password</label>
        <span class="auth-input auth-input--password">
          <input type="password" id="new_password" name="new_password" autocomplete="new-password" required autofocus>
          <button type="button" class="auth-toggle" data-toggle-password aria-label="Show password">Show</button>
        </span>
        <p class="auth-error" data-error-for="new_password"></p>
      </div>

      <div class="auth-field">
        <label for="confirm_password">Confirm new password</label>
        <span class="auth-input"><input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required></span>
        <p class="auth-error" data-error-for="confirm_password"></p>
      </div>

      <button type="submit" class="auth-submit" data-busy-label="Saving…">Save password</button>
    </form>

    <p class="auth-foot"><a class="auth-link" href="{% url 'accounts:signin' %}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/auth.js' %}?v=1"></script>{% endblock %}
