{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post a Job | Raket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/post_job.css' %}">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <a href="#" class="logo" aria-label="Raket home">
      <img src="{% static 'image/raket_logo.png' %}" alt="Raket">
    </a>

    <nav class="main-nav">
      <a href="#" class="nav-link">HOME</a>
      <a href="#" class="nav-link">FOR WORKERS <span class="caret"></span></a>
      <a href="#" class="nav-link">FOR HOUSEHOLDS <span class="caret"></span></a>
    </nav>

    <div class="auth">
      <a href="#" class="sign-up">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V6a4 4 0 0 1 8 0v0"/>
        </svg>
        Sign Up
      </a>
      <a href="#" class="sign-in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
        Sign In
      </a>
    </div>
  </header>

  <!-- ============ FORM ============ -->
  <main class="page">
    <h1 class="page-title">POST A JOB</h1>
    <p class="page-subtitle">Provide the details of your short-term job oppotunity</p>

    <form class="job-form" action="#" method="post">
      {% csrf_token %}

      <div class="row two-col">
        <div class="field">
          <label for="job-title">Job Title</label>
          <input type="text" id="job-title" name="job_title" placeholder="e.g. House Cleaning">
        </div>
        <div class="field">
          <label for="job-category">Job Category</label>
          <div class="select-wrap">
            <select id="job-category" name="job_category">
              <option>Select category</option>
            </select>
            <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8 8 8-8"/></svg>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="job-description">Job Description</label>
          <textarea id="job-description" name="job_description" class="tall" placeholder="Describe the job, duties, and any additional information..."></textarea>
        </div>
      </div>

      <div class="row two-col">
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="City / Barangay">
        </div>
        <div class="field">
          <label for="work-date">Work Date</label>
          <div class="select-wrap">
            <input type="text" id="work-date" name="work_date" placeholder="Select date">
            <svg class="icon-right" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="5" width="17" height="16" rx="3"/>
              <path d="M3.5 10h17M8 3v4M16 3v4"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="row two-col">
        <div class="field">
          <label for="work-schedule">Work Schedule</label>
          <div class="select-wrap">
            <select id="work-schedule" name="work_schedule">
              <option>Select schedule</option>
            </select>
            <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8 8 8-8"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="payment">Estimated Payment</label>
          <input type="text" id="payment" name="estimated_payment" placeholder="e.g. 500 Pesos">
        </div>
      </div>

      <div class="row two-col align-top">
        <div class="field">
          <label for="workers">Number of Workers</label>
          <div class="select-wrap">
            <input type="number" id="workers" name="number_of_workers" class="short" placeholder="e.g. 1" min="1">
            <svg class="icon-right spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="requirements">Requirements / Skills <span class="optional">(optional)</span></label>
          <textarea id="requirements" name="requirements" class="medium" placeholder="e.g. Must be 18+, with cleaning experience"></textarea>
        </div>
      </div>

      <div class="confirm">
        <input type="checkbox" id="confirm" name="confirm">
        <label for="confirm">I confirm the job details are accurate</label>
      </div>

      <div class="actions">
        <button type="submit" class="btn-post">Post Job</button>
        <button type="button" class="btn-cancel">Cancel</button>
      </div>

    </form>
  </main>

</body>
</html>
